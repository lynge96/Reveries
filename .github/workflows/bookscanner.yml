name: Publish Bookscanner

# Runs only on merge to main (a push), and only when something that affects
# the scanner image changed. Build & tests run first as a gate; the image is
# only built and pushed if they pass.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/Reveries.Blazor.BookScanner/**'
      - 'src/Reveries.Contracts/**'
      - '.github/workflows/bookscanner.yml'
      - '.github/actions/build-test/**'
      - '.github/actions/docker-build/**'
  workflow_dispatch:

permissions:
  contents: read

# Queue overlapping merges instead of cancelling — don't interrupt a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build & test
        uses: ./.github/actions/build-test

  publish:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build & push image
        uses: ./.github/actions/docker-build
        with:
          dockerfile: src/Reveries.Blazor.BookScanner/Dockerfile
          image-name: reveries-bookscanner
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}