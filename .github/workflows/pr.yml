name: PR

# Runs on every pull request, regardless of target branch (and each new
# commit pushed to it). This is the merge gate — mark its check as required
# in branch protection.
on:
  pull_request:

# Least privilege: read the code; checks:write lets the test reporter publish.
permissions:
  contents: read
  checks: write

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build & test
        uses: ./.github/actions/build-test

      - name: Verify OpenAPI spec is up to date
        shell: bash
        run: |
          dotnet build src/Reveries.Api/Reveries.Api.csproj -t:GenerateOpenApi
          git diff --exit-code -- src/Reveries.Api/openapi.json \
            || { echo "::error::openapi.json is out of date. Run 'dotnet build src/Reveries.Api/Reveries.Api.csproj -t:GenerateOpenApi' and commit the result."; exit 1; }